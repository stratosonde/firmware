name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # F-013 (#210): the stability suite scans h3lite.c (a submodule) -
          # without this the host gate exits 2 on the missing file.
          submodules: recursive
      # STAB-09 (#156): the FULL host gate — test + flight + findings + burst.
      # The findings/burst suites hold the autonomous-control regressions
      # (BURST-01/02/03, R2-13, STAB-*) and must be merge gates, not opt-in.
      - name: All host regression suites
        run: make -C tests/host all
      - name: Host tests with UBSan/ASan (F16, 2026-08-11 review)
        run: make -C tests/host sanitize

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Build firmware
        run: make -C Debug -j"$(nproc)" all

  # FR-20 (#101): the binary that flies must be the binary CI builds.
  firmware-flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Build flight configuration (SONDE_FLIGHT_BUILD)
        run: |
          # F12 (#173): the sed injection must fail LOUDLY if CubeMX regen
          # changes the fragment syntax and the substitution stops matching —
          # otherwise CI ships a "flight" binary that is not a flight build.
          find Debug -name subdir.mk -exec sed -i 's/-DDEBUG -DCORE_CM4/-DDEBUG -DSONDE_FLIGHT_BUILD -DCORE_CM4/' {} +
          # Only C-compile fragments carry -DCORE_CM4 (Startup assembler rules
          # use -DDEBUG alone and are legitimately untouched by the sed), so
          # scope the check to fragments that have CORE_CM4. Judge by OUTPUT,
          # not exit status: grep -L exits 0 whenever ANY input file matched
          # (line-selection semantics), so the original `grep -rL ... && FATAL`
          # and any exit-status variant fire unconditionally. An all-assembler
          # match set passes vacuously here, but the SONDE_BUILD:flight marker
          # check below still gates that case.
          missed=$(grep -rl "DCORE_CM4" Debug --include=subdir.mk | xargs -r grep -L "DSONDE_FLIGHT_BUILD" || true)
          if [ -n "$missed" ]; then echo "FATAL: flight macro injection missed fragment(s): $missed"; exit 1; fi
          make -C Debug all -j"$(nproc)"
          arm-none-eabi-size Debug/Radio_Sonde_E5_HF_EU.elf
      - name: Prove the flight marker is in the binary (F12/#173)
        run: |
          arm-none-eabi-objcopy -O binary Debug/Radio_Sonde_E5_HF_EU.elf /tmp/flight.bin
          grep -q "SONDE_BUILD:flight" /tmp/flight.bin || { echo "FATAL: flight build marker missing"; exit 1; }
          grep -q "SONDE_BUILD:debug" /tmp/flight.bin && { echo "FATAL: debug build marker present"; exit 1; } || true

  # Phase 3 (pretest-hardening handoff): hygiene gate - cppcheck over
  # first-party sources (gated), actionlint (gated), clang-format
  # changed-lines (report mode while the 2-/4-space style split is open).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install hygiene tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-format
      - name: cppcheck gate (first-party)
        run: bash tools/run_cppcheck.sh
      - name: actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint
      - name: clang-format changed-lines (report mode)
        run: bash tools/check_format.sh "${{ github.event.before }}"
