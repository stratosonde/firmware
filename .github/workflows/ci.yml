name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # F-013 (#210): the stability suite scans h3lite.c (a submodule) -
          # without this the host gate exits 2 on the missing file.
          submodules: recursive
      # STAB-09 (#156): the FULL host gate — test + flight + findings + burst.
      # The findings/burst suites hold the autonomous-control regressions
      # (BURST-01/02/03, R2-13, STAB-*) and must be merge gates, not opt-in.
      - name: All host regression suites
        run: make -C tests/host all
      - name: Host tests with UBSan/ASan (F16, 2026-08-11 review)
        run: make -C tests/host sanitize

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: PROJECT_CPPFLAGS gate (PIPE-04/#265)
        run: python3 tools/check_project_cppflags.py
      - name: Build firmware
        run: make -C Debug -j"$(nproc)" all
      - name: Prove the debug marker (and only it) is in the binary
        run: |
          arm-none-eabi-objcopy -O binary Debug/Radio_Sonde_E5_HF_EU.elf /tmp/debug.bin
          grep -q "SONDE_BUILD:debug" /tmp/debug.bin || { echo "FATAL: debug build marker missing"; exit 1; }
          if grep -q "SONDE_BUILD:flight" /tmp/debug.bin; then echo "FATAL: flight marker present in a debug build"; exit 1; fi
      - name: Source tree unchanged by the build (PIPE-04)
        run: git diff --exit-code --stat

  # FR-20 (#101): the binary that flies must be the binary CI builds.
  firmware-flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: PROJECT_CPPFLAGS gate (PIPE-04/#265)
        run: python3 tools/check_project_cppflags.py
      - name: Build flight configuration (flags, not source mutation; PIPE-04/#265)
        run: |
          # The sed injection ritual is RETIRED: the flight define travels via
          # the centralized PROJECT_CPPFLAGS make variable, which the gate
          # above proves every active C recipe honours. The embedded-marker
          # check below still proves the binary is a flight build (F12/#173).
          make -C Debug clean
          make -C Debug all -j"$(nproc)" PROJECT_CPPFLAGS=-DSONDE_FLIGHT_BUILD
          arm-none-eabi-size Debug/Radio_Sonde_E5_HF_EU.elf
      - name: Prove the flight marker is in the binary (F12/#173)
        run: |
          arm-none-eabi-objcopy -O binary Debug/Radio_Sonde_E5_HF_EU.elf /tmp/flight.bin
          grep -q "SONDE_BUILD:flight" /tmp/flight.bin || { echo "FATAL: flight build marker missing"; exit 1; }
          if grep -q "SONDE_BUILD:debug" /tmp/flight.bin; then echo "FATAL: debug build marker present"; exit 1; fi
      - name: Source tree unchanged by the build (PIPE-04)
        run: git diff --exit-code --stat

  # Phase 3 (pretest-hardening handoff): hygiene gate - cppcheck over
  # first-party sources (gated), actionlint (gated), clang-format
  # changed-lines (HARD GATE since the 2-space unification, owner decision).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # the format gate diffs against github.event.before
      - name: Install hygiene tools
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          python3 -m pip install clang-format==22.1.8
      - name: PROJECT_CPPFLAGS gate (PIPE-04/#265)
        run: python3 tools/check_project_cppflags.py
      - name: cppcheck gate (first-party)
        run: bash tools/run_cppcheck.sh
      - name: actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint
      - name: clang-format changed-lines gate
        run: bash tools/check_format.sh "${{ github.event.before }}"
